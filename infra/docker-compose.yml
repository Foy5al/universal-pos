services:
  postgres:
    image: postgres:16-alpine
    container_name: universal-pos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
      POSTGRES_DB: pos
    ports:
      - '5432:5432'
    volumes:
      - pos-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pos -d pos']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pos-db-data:
